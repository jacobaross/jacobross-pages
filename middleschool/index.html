<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'">
  <title>Private middle school plan</title>
  <style>
    :root { color-scheme: light; --ink:#172936; --muted:#4d606e; --line:#dce4e9; --blue:#006a78; --paper:#fff; --back:#f3f6f8; --error:#a12636; }
    * { box-sizing:border-box; }
    body { min-height:100svh; margin:0; display:grid; place-items:center; padding:24px; background:var(--back); color:var(--ink); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%, 420px); padding:32px 28px; border-top:6px solid var(--blue); background:var(--paper); box-shadow:0 16px 42px rgba(23,41,54,.1); }
    .eyebrow { margin:0 0 10px; color:var(--muted); font-size:.78rem; font-weight:750; letter-spacing:.13em; text-transform:uppercase; }
    h1 { margin:0; font-size:2rem; line-height:1.12; letter-spacing:-.035em; }
    p { margin:12px 0 0; color:var(--muted); }
    form { margin-top:24px; }
    label { display:block; margin-bottom:8px; font-size:.9rem; font-weight:700; }
    input { width:100%; min-height:48px; padding:11px 13px; border:1px solid #bfcbd2; border-radius:5px; background:#fff; color:var(--ink); font:inherit; }
    input:focus { border-color:var(--blue); outline:3px solid rgba(0,106,120,.16); }
    button { width:100%; min-height:48px; margin-top:12px; border:0; border-radius:5px; background:var(--blue); color:#fff; font:700 1rem/1 inherit; cursor:pointer; }
    button:disabled { cursor:wait; opacity:.65; }
    button:focus-visible { outline:3px solid rgba(0,106,120,.25); outline-offset:3px; }
    #status { min-height:24px; color:var(--error); font-size:.9rem; }
    .privacy { font-size:.82rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Private family page</p>
    <h1>Middle school plan</h1>
    <p>Enter the family password to continue.</p>
    <form id="unlock-form">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="unlock-button" type="submit">Open plan</button>
    </form>
    <p id="status" role="alert" aria-live="polite"></p>
    <p class="privacy">The plan is encrypted. Your password stays on this device.</p>
  </main>
  <script>
    const form = document.getElementById('unlock-form');
    const passwordInput = document.getElementById('password');
    const button = document.getElementById('unlock-button');
    const status = document.getElementById('status');
    const decoder = new TextDecoder('utf-8', { fatal: true });
    const encoder = new TextEncoder();

    function decodeBase64(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
      return bytes;
    }

    async function decryptPage(password) {
      const response = await fetch('./payload.json', { cache: 'no-store' });
      if (!response.ok) throw new Error('payload-unavailable');
      const payload = await response.json();
      const keyMaterial = await crypto.subtle.importKey(
        'raw',
        encoder.encode(password),
        'PBKDF2',
        false,
        ['deriveKey']
      );
      const key = await crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: decodeBase64(payload.salt),
          iterations: payload.iterations,
          hash: 'SHA-256'
        },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      const plaintext = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: decodeBase64(payload.iv) },
        key,
        decodeBase64(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.textContent = '';
      button.disabled = true;
      button.textContent = 'Opening…';
      try {
        const html = await decryptPage(passwordInput.value);
        passwordInput.value = '';
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        status.textContent = error.message === 'payload-unavailable'
          ? 'The plan could not be loaded. Please try again.'
          : 'That password was not recognized.';
        passwordInput.select();
        button.disabled = false;
        button.textContent = 'Open plan';
      }
    });
  </script>
</body>
</html>
